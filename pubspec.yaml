name: eClassify
description: A classified app


publish_to: 'none' # Remove this line if you wish to publish to pub.dev [Be careful]

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.2.2
  omni_video_player: ^5.0.0
  country_picker: ^2.0.26
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.8.0+1
  image_picker: ^1.1.2
  flutter_bloc: ^9.1.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  dotted_border: ^3.1.0
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  in_app_review: ^2.0.10
  lottie: ^3.3.1
  mime_type: ^1.0.1
  # Pinned below 0.12.x — that line reproduces the active-plan-screen
  # double-navigation bug (spurious onActionReceivedMethod firing without a
  # real tap). Confirmed not reproducible on 0.11.0. Revisit once fixed
  # upstream or root-caused further.
  awesome_notifications: ^0.11.0
  path_provider: ^2.1.5
  record: ^7.1.1
  audioplayers: ^6.4.0
  permission_handler: ^13.0.1
  package_info_plus: ^10.2.1
  geocoding: ^5.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  geolocator: ^14.0.0
  flutter_svg: ^2.2.3
  google_mobile_ads: ^9.1.0
  google_maps_flutter: ^2.14.0
  vibration: ^3.1.3
  device_region: ^1.4.0
  flutter_pdfview: ^1.4.0+1

  path: ^1.9.1
  device_info_plus: ^13.2.0
  sms_autofill: ^2.4.1
  webview_flutter: ^4.11.0
  flutter_widget_from_html: ^0.17.2
  file_picker: ^12.0.0
  background_downloader: ^9.5.5
  android_intent_plus: ^6.1.0

  #payment gateways
  wrteam_payment:
    git:
      url: https://github.com/WRTeam-in/wrteam_payment.git

  in_app_purchase: ^3.2.1
  firebase_app_check: ^0.4.4+1
  collection: ^1.19.1
  open_file: ^4.0.0
  timeago: ^3.7.1
  timeago_flutter: ^3.7.0
  uuid: ^4.5.2
  flutter_libphonenumber: ^2.7.0
  logger: ^2.6.2
  intl: ^0.20.2
  flutter_html_to_pdf_plus: ^0.4.0
  html: ^0.15.6
  phosphoricons_flutter:
    git:
      url: https://github.com/wrteam-ishit/phosphoricons_flutter.git
  heif_converter: ^1.0.6
  video_trimmer: ^5.0.0
  video_player: ^2.11.1
  dio_cache_interceptor: ^4.0.7
  flutter_link_previewer: ^4.2.0
  http_cache_hive_store: ^5.1.0
  rxdart: ^0.28.0
  app_links: ^7.2.1
  pinput: ^6.0.2
  smart_auth: ^3.2.0
  path_drawing: ^1.0.1
  flutter_debug_logger:
    git:
      url: https://github.com/raj-wrteam/flutter-debug-logger.git
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  change_app_package_name: ^1.5.0
  curl_logger_dio_interceptor: ^1.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  rename: ^3.0.0
  # Subhankar Added for change app icons [configuration is in a separate file (e.g., flutter_launcher_icons.yaml)]
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/bottom_navigation/
    - assets/icons/branding/
    - assets/icons/illustrators/
    - assets/icons/payment/
    - assets/icons/profile/
    - assets/icons/social/
    - assets/icons/common/
    - assets/languages/
    - assets/lottie/
    - assets/map/


  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800